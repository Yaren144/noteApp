<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App - Notes</title>
     <link rel="stylesheet" href="./styleNotes.css" />
</head>

    <body>  
        <header class="header">
            <img src="notes_icon2.png" class="header-logo">
            <h1>Notes App</h1>
            <nav class="header-nav">
                <button id="logoutBtn" class="auth-button">Logout</button>
            </nav>
        </header>

        <main class="container">
            <div class="notes-header">
                <h1>My Notes</h1> 
            </div>

            <div class="add-note-btn">
                <a href="add_note.html" id="addNoteBtn">
                    <svg class="add-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    Add New Note
                </a>
            </div>
    
            <div  id="notesContainer">
                <div  id="note-card"></div>
                <div class="empty-state" id="emptyState">
                <p>No notes yet. Click "Add New Note" to create your first note!</p>
                </div>
            </div>
        
        </main>
            <script src="api.js"></script>
            <script src="main.js" defer></script>
            <script src="notes.js" defer></script>

    </body>
</html>
