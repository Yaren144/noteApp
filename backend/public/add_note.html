<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App - Add Note</title>
    <link rel="stylesheet" href="styleNotes.css">
</head>

<body>
    <header class="header">
        <img src="notes_icon2.png" alt="Notes App Logo" class="header-logo">
        <h1>Notes App</h1>
        <nav class="header-nav">
            <button id="logoutBtn" class="auth-button">Logout</button>
            
            
        </nav>
    </header>

    <main class="container">
        <section class="content">
            <h2 style="text-align: center;">Add New Note</h2>
            
            <div class="add-note-section">
                <form class="add-note-form" id="noteForm">
                    <div class="form-group">
                        <label for="noteTitle">Note Title</label>
                        <input type="text" id="noteTitle" name="title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="noteContent">Content</label>
                        <textarea id="noteContent" name="content" required></textarea>
                    </div>
                    

                    
                    <div class="form-buttons">
                        <button type="button" id="clearBtn" class="btn btn-secondary">Clear</button>
                        <button type="submit" class="btn btn-primary">Save Note</button>
                    </div>
                </form>
            </div>
            
            <div class="notes-list" id="notesList">
               
            </div>
        </section>
    </main>
    <script src="api.js"></script>
    <script src="main.js" defer></script>
    <script src="add_note.js" defer></script>
</body>
</html>
